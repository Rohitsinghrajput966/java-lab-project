<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52">
  <defs>
    <linearGradient id="ssBlueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ssFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ssFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="ssAccentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="ssShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Sphere/Cart Hex Monogram -->
  <g transform="translate(6, 6)" filter="url(#ssShadow)">
    <rect x="0" y="0" width="40" height="40" rx="12" fill="#eff6ff" />
    <rect x="0.5" y="0.5" width="39" height="39" rx="11.5" fill="none" stroke="url(#ssBlueGlow)" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Stylized S Sphere Orbit Rings -->
    <path d="M12 16 C12 12, 28 10, 28 16 C28 22, 12 20, 12 26 C12 32, 28 30, 28 26" fill="none" stroke="url(#ssFacet1)" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Orbit Accent Dot -->
    <circle cx="28" cy="15" r="2.8" fill="url(#ssAccentGold)" />
    <circle cx="12" cy="27" r="2.4" fill="url(#ssFacet2)" />
  </g>

  <!-- Brand Typography -->
  <text x="56" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
    SHOP<tspan fill="#2563eb">SPHERE</tspan>
  </text>
  <text x="57" y="39" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#64748b" letter-spacing="2.2">
    MEGA E-COMMERCE STORE
  </text>
</svg>
